name: Sync to HuggingFace Spaces

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HFTOKEN }}
        run: |
          git remote add hf https://abhinavp10:$HF_TOKEN@huggingface.co/spaces/abhinavp10/llm-benchmarking
          git push hf main --force
